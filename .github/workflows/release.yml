name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained build
        shell: pwsh
        run: |
          dotnet publish src/WinterDesktop.App/WinterDesktop.App.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -o publish
          Compress-Archive -Path publish/WinterDesktop.exe `
            -DestinationPath WinterDesktop-win-x64.zip

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" WinterDesktop-win-x64.zip `
            --title "Winter Desktop ${{ github.ref_name }}" `
            --generate-notes
